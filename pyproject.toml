[project]
name = "scania-aps-cost"
version = "0.2.2"
description = "Cost-sensitive failure prediction on real Scania APS operational data"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diogo Ribeiro" }]
maintainers = [{ name = "Diogo Ribeiro" }]
keywords = [
  "cost-sensitive learning",
  "imbalanced classification",
  "predictive maintenance",
  "probability calibration",
  "threshold optimization",
  "reproducible research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/scania-aps-cost"
Repository = "https://github.com/DiogoRibeiro7/scania-aps-cost"
Issues = "https://github.com/DiogoRibeiro7/scania-aps-cost/issues"
Changelog = "https://github.com/DiogoRibeiro7/scania-aps-cost/blob/main/CHANGELOG.md"
Documentation = "https://github.com/DiogoRibeiro7/scania-aps-cost/tree/main/docs"

[project.scripts]
scania-aps = "scania_aps.cli:main"

[tool.poetry]
packages = [{ include = "scania_aps", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"
mypy = ">=1.11"
pandas-stubs = ">=2.2"
pre-commit = ">=3.8"

[tool.poetry.group.boost]
optional = true

[tool.poetry.group.boost.dependencies]
xgboost = ">=2.1,<4"
lightgbm = ">=4.5,<5"

[tool.poetry.group.neural]
optional = true

[tool.poetry.group.neural.dependencies]
torch = ">=2.4"

[tool.poetry.group.imbalance]
optional = true

[tool.poetry.group.imbalance.dependencies]
imbalanced-learn = ">=0.13"

[tool.poetry.group.explain]
optional = true

[tool.poetry.group.explain.dependencies]
shap = ">=0.46"

[tool.poetry.group.notebooks]
optional = true

[tool.poetry.group.notebooks.dependencies]
jupyter = ">=1.1"
matplotlib = ">=3.9"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = []

# The scientific stack does not ship inline types or a py.typed marker.
# Silencing the missing stubs here keeps --strict meaningful for this
# project's own code instead of drowning it in third-party import noise.
[[tool.mypy.overrides]]
module = [
  "imblearn.*",
  "joblib.*",
  "lightgbm.*",
  "shap.*",
  "sklearn.*",
  "torch.*",
  "xgboost.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# No --maxfail: CI should report every failure in one run, not just the first.
addopts = "-q --disable-warnings --strict-markers --strict-config"
