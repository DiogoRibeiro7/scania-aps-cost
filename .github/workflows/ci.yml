name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POETRY_VERSION: "2.2.1"

jobs:
  lint:
    name: Lint, types and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-in-project: true

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-lint-3.12-${{ hashFiles('poetry.lock') }}

      - run: poetry check --lock
      - run: poetry install --no-interaction

      - name: Ruff lint
        run: poetry run ruff check src tests

      - name: Ruff format
        run: poetry run ruff format --check src tests

      - name: Mypy (strict)
        run: poetry run mypy src

      - name: Validate citation metadata
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import json, pathlib, tomllib
          import yaml

          zen = json.loads(pathlib.Path(".zenodo.json").read_text(encoding="utf-8"))
          for key in ("title", "upload_type", "license", "creators", "version"):
              assert key in zen, f".zenodo.json is missing '{key}'"
          assert zen["creators"], ".zenodo.json lists no creators"

          cff = yaml.safe_load(pathlib.Path("CITATION.cff").read_text(encoding="utf-8"))
          for key in ("cff-version", "title", "authors", "license", "version"):
              assert key in cff, f"CITATION.cff is missing '{key}'"

          project = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          versions = {
              "pyproject.toml": project,
              "CITATION.cff": str(cff["version"]),
              ".zenodo.json": str(zen["version"]),
          }
          assert len(set(versions.values())) == 1, f"version mismatch: {versions}"
          print(f"citation metadata OK (version {project})")
          PY

  test:
    name: Tests (core deps, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-in-project: true

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-core-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - run: poetry install --no-interaction

      # Optional-group tests skip here by design: the package must stay usable
      # without PyTorch, XGBoost, LightGBM or SHAP installed.
      - name: Pytest
        run: poetry run pytest -q

  test-full:
    name: Tests (all optional groups)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-in-project: true

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-full-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install with boosting, neural and imbalance extras
        run: poetry install --no-interaction --with boost,neural,imbalance

      - name: Pytest with coverage
        run: |
          poetry run pytest -q \
            --cov=scania_aps --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Build sdist and wheel
        run: poetry build

      - name: Check the wheel is installable on its own
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet dist/*.whl
          /tmp/probe/bin/python -c "import scania_aps; print(scania_aps.__name__, 'imports cleanly')"
          /tmp/probe/bin/scania-aps --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
